# Fetches Cecafé's daily export summary every weekday evening (Brasília time),
# appends it to volumes/cecafe_daily.csv, rebuilds data/volumes.js and commits.
name: Cecafé daily export summary

on:
  schedule:
    - cron: "30 21 * * 1-5"   # 18:30 America/Sao_Paulo (UTC-3), Monday to Friday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch Cecafé daily summary
        id: plain
        continue-on-error: true
        run: python volumes/fetch_cecafe.py --save-html cecafe_page.html
      - name: Fetch with a browser (fallback if the tables are rendered by JavaScript)
        if: steps.plain.outcome == 'failure'
        run: |
          pip install playwright
          playwright install --with-deps chromium
          python volumes/fetch_cecafe.py --browser --save-html cecafe_page.html
      - name: Keep the fetched page as an artifact (debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cecafe-page-${{ github.run_id }}
          path: cecafe_page.html
          retention-days: 7
      - name: Rebuild data/volumes.js
        run: python volumes/build_volumes.py
      - name: Rebuild volumes/suivi_cecafe.xlsx
        run: |
          pip install openpyxl
          python volumes/build_xlsx.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add volumes/cecafe_daily.csv data/volumes.js volumes/suivi_cecafe.xlsx
          if git diff --cached --quiet; then
            echo "nothing new"
          else
            git commit -m "cecafe: daily export summary $(date -u +%F)"
            git push
          fi
